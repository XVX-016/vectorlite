[workspace]
resolver = "2"
members = [
    "crates/vl-core",
    "crates/vl-index",
    "crates/vl-storage",
    "crates/vl-filter",
    "crates/vl-server",
    "crates/vl-bench",
    "crates/vl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["VectorLite Contributors"]
license = "MIT"
repository = "https://github.com/your-org/vectorlite"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
